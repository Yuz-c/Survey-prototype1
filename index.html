<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アンケート</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background: #B8B2C4;
      color: #302A3A;
      padding: 20px;
    }

    .survey {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px;
      background: #A39AAF;
      border-radius: 20px;
      box-shadow: 0 8px 30px #51465f30;
      text-align: center;
    }

    .label {
      color: #F1EDF7;
      font-size: 14px;
      margin-bottom: 16px;
      letter-spacing: 0.08em;
    }

    h1 {
      font-size: 28px;
      line-height: 1.5;
      margin: 0 0 32px;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      min-width: 0;
      min-height: 56px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible {
      outline: 3px solid #FFFFFF;
      outline-offset: 3px;
    }

    .yes {
      background: #8875C7;
      color: white;
    }

    .no {
      background: #E7E1EE;
      color: #40374D;
    }

    #result {
      margin: 24px 0 0;
      color: #F7F4FA;
      font-size: 14px;
      min-height: 21px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="survey">
    <div class="label">アンケート</div>

    <h1 id="question">仮の質問1</h1>

    <div class="buttons" id="buttons">
      <button class="yes" id="yesButton">はい</button>
      <button class="no" id="noButton">いいえ</button>
    </div>

    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    // 質問と、回答後に進む先を設定する
    const questions = {
      q1: {
        text: "ready?",
        yes: "q2",
        no: "shobon"
      },

      q2: {
        text: "どー？",
        yes: "q4",
        no: "q5"
      },

      shobon: {
        text: "(´・ω・｀)",
        yes: "end",
        no: "end"
      },

      q4: {
        text: "O1え、マジで？",
        yes: "half1",
        no: "q7"
      },

      q5: {
        text: "X1やっぱダメすか...",
        yes: "shobon",
        no: "q9"
      },

      q7: {
        text: "あ、やっぱダメ?",
        yes: "q5",
        no: "q9"
      },

      q9: {
        text: "え?やっぱワンチャンある?",
        yes: "q4",
        no: "q5"
      }
    };

    let currentQuestion = "q1";
    const history = [];

    const questionElement = document.getElementById("question");
    const resultElement = document.getElementById("result");
    const buttonsElement = document.getElementById("buttons");
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");

    function showQuestion() {
      const question = questions[currentQuestion];

      questionElement.textContent = question.text;
      resultElement.textContent = "";
      buttonsElement.hidden = false;
      document.querySelector(".label").hidden = false;
    }

    function answer(value) {
      const question = questions[currentQuestion];
      const nextQuestion = question[value];

      history.push({
        questionId: currentQuestion,
        answer: value
      });

      if (nextQuestion === "shobon") {
        document.querySelector(".label").hidden = true;
        questionElement.textContent = "(´・ω・｀)";
        resultElement.textContent = "";
        buttonsElement.hidden = true;
        return;
      }

      if (nextQuestion === "end") {
        questionElement.textContent = "アンケート終了";
        resultElement.textContent = "回答ありがとうございました！";
        buttonsElement.hidden = true;
        return;
      }

      currentQuestion = nextQuestion;
      showQuestion();
    }

    yesButton.addEventListener("click", () => answer("yes"));
    noButton.addEventListener("click", () => answer("no"));

    showQuestion();
  </script>
</body>
</html>
```
